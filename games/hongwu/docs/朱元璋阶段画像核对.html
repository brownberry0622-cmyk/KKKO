<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朱元璋 · 分期形象与面容基准</title><style>body{margin:0;background:#eee7d5;color:#263e33;font:16px/1.9 Microsoft YaHei,sans-serif}header{background:#233f32;color:#f4e5bf;padding:24px 5vw}main{max-width:1120px;margin:30px auto;padding:0 24px}h1,h2{font-family:KaiTi,serif}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}figure{margin:0;background:#f8f2e4;padding:14px}img{width:100%;display:block}figcaption{font-size:14px}table{border-collapse:collapse;width:100%}td,th{padding:12px;border-bottom:1px solid #cbbc99;text-align:left}.note{padding:20px;background:#e1d6bd}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header><a href="../index.html">← 章节目录</a><h1>朱元璋 · 分期形象与面容基准</h1></header><main><p class="note">面容保持一致，年龄与身份通过克制的变化表达。本页展示已接入游戏的分期代表图。</p><div class="grid"><figure><img loading="lazy" src="../chapter1/assets/portraits/redturban-1352-service.webp" alt="1352—1353 · 郭部红巾青年"><figcaption><strong>1352—1353 · 郭部红巾青年</strong><p>第一章正常游玩使用投军后的红巾形象；僧衣留给投军前语境。</p></figcaption></figure><figure><img loading="lazy" src="../chapter2/assets/chapter2/portrait-armor.webp" alt="1353—1356 · 临阵主将"><figcaption><strong>1353—1356 · 临阵主将</strong><p>青年脸型保留，临阵按场景使用甲胄。</p></figcaption></figure><figure><img loading="lazy" src="../chapter4/assets/portraits/zhu-armor.webp" alt="1356—1360 · 江南经营"><figcaption><strong>1356—1360 · 江南经营</strong><p>轻微风霜与短髭须；不以削瘦脸颊制造成熟。</p></figcaption></figure><figure><img loading="lazy" src="../chapter5/assets/art/portrait-zhu1363-camp.webp" alt="1361—1363 · 军府常服"><figcaption><strong>1361—1363 · 军府常服</strong><p>成熟而可辨认的同一人；姿态与目光表现主将身份。</p></figcaption></figure><figure><img loading="lazy" src="../chapter6/assets/art/portrait-zhu1363-armor.webp" alt="1361—1364 · 前线甲胄"><figcaption><strong>1361—1364 · 前线甲胄</strong><p>盔甲用于当前临阵场景，非每一场家庭或文书谈话。</p></figcaption></figure><figure><img loading="lazy" src="../chapter6/assets/art/portrait-zhu1364-court.webp" alt="1364 · 吴王政务"><figcaption><strong>1364 · 吴王政务</strong><p>沿用用户选定的吴王面容。称谓由奉位事件完成后变更，尚未使用登极礼服。</p></figcaption></figure></div><h2>同一人的成长</h2><p>朱元璋、马氏保留用户指定的眉眼、鼻唇与脸型关系。成熟不等于换脸：权位主要由处境、姿态、服装、目光与他人的反应体现。沐英、李文忠等也按章节年龄更换相应人物图。</p><p>各阶段并非每年一张写实肖像。具体容貌、须髭和服饰细节属于美术复原；用户提供的AI年轻化参考是本作形象基准，不作为当年实貌确证。第三人称仍使用简化模型，并非高精度三维面模。</p><p><a href="UI人物原画校核.json">查看人物用图接入记录</a> · <a href="../任务影卷总览.html">查看实际剧情场景</a></p></main></html>
