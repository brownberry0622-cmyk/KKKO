<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第三章 · 原画与分镜</title><style>body{margin:0;background:#e8ddc3;color:#293f32;font:16px/1.9 Microsoft YaHei,sans-serif}main{max-width:1100px;margin:30px auto;padding:24px}h1,h2,h3{font-family:KaiTi,serif}h1{font-size:38px}a{color:#8d4b30}p{max-width:880px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:13px;border:1px solid #b09a6b;text-align:left}small{color:#7f7256}button,select{padding:10px;background:#314d3c;color:#e9d9b4;border:1px solid #998153;margin:5px}img{max-width:100%}</style><main><h1>第三章 · 原画与分镜</h1><p><a href="前三章史实与人物校核.html">查看新增史事与前三章人物校核总表</a></p><p>每段六张独立构图；每个方案使用五张，两个方案各有一张专属收束镜头。19张本章人物基准，另增51张独立肖像；完整70位人物请在游戏“人物志 · 史事”中查看。采用内置 imagegen，提示词及逐张来源JSON保存在E盘美术与制作工具目录。</p><select id="group"><option value="portraits">人物肖像</option><option value="hezhou">和州总军</option><option value="hostage">徐达代质</option><option value="hezhoufight">和阳破围</option><option value="succession">郭帅辞世</option><option value="chang">遇春来归</option><option value="chaohu">巢湖来舟</option><option value="caishi">牛渚先登</option><option value="taiping">太平立足</option><option value="taipingfight">太平水陆解围</option><option value="setback">集庆两攻受挫</option><option value="watergate">再破采石</option><option value="fangshan">方山纳众</option><option value="jiqing">集庆改应天</option></select><div id="gallery"></div><style>#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}figure{margin:0;background:#dbc89f}figure img{width:100%;display:block}figcaption{font-size:12px;padding:10px}dialog{max-width:95vw;background:#e8ddc3;border:1px solid #8b734b}dialog img{max-height:80vh}dialog::backdrop{background:#172b24cc}@media(max-width:720px){#gallery{grid-template-columns:repeat(2,1fr)}}</style><dialog id="lightbox"><button onclick="this.parentElement.close()">关闭</button><img id="large"></dialog><script src="art.js?v=866894c3b111"></script><script>const g=document.getElementById("group"),wrap=document.getElementById("gallery");function draw(){wrap.replaceChildren();for(const [id,s]of Object.entries(Chapter3Art).filter(([id,s])=>g.value==="portraits"?s.portrait:!s.portrait&&id.startsWith(g.value+"-"))){const fig=document.createElement("figure"),im=document.createElement("img"),cap=document.createElement("figcaption");im.src="assets/chapter3/"+id+".webp";im.alt=s.caption;cap.textContent=id+" · "+s.caption;im.onclick=()=>{document.getElementById("large").src=im.src;document.getElementById("lightbox").showModal();};fig.append(im,cap);wrap.append(fig);}}g.onchange=draw;draw();</script></main></html>
