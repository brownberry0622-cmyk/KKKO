<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="chapter3/"><title>洪武：兵起濠州 · 自走棋试阵</title><link rel="stylesheet" href="autochess.css"><style>body{margin:0;background:#e9e0c7;color:#294235;font-family:"Microsoft YaHei",sans-serif}body>header{padding:20px max(3vw,16px);display:flex;justify-content:space-between;align-items:center;background:#192f28;color:#eddcb6}body>header b{font:25px KaiTi,serif;letter-spacing:3px}a{color:inherit}.intro{max-width:1360px;margin:auto;padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:20px}.intro h1{font:27px KaiTi,serif;letter-spacing:3px;margin:0 0 10px}.intro p{font-size:12px;line-height:1.8;margin:0;color:#6d7058}.intro select,.intro button{padding:11px 13px;font:13px "Microsoft YaHei";border:1px solid #b6a784;background:#f6edd7;color:#2a4435;cursor:pointer}.intro nav{display:flex;gap:7px;flex-wrap:wrap}main{max-width:1320px;margin:0 auto 30px;box-shadow:0 15px 50px #243b2529}.review-report{padding:45px;text-align:center;background:#f4ecd5;line-height:2}.review-report h2{font:36px KaiTi,serif}.review-report button{padding:12px 25px;background:#294a37;color:#f7e8c5;border:0;cursor:pointer}dialog{background:#f0e7ce;color:#2c4437;border:1px solid #ad9363;max-width:640px;line-height:2;padding:28px}dialog::backdrop{background:#10271dd9}dialog button{background:#2f4b39;color:#f4e4bf;border:0;padding:10px 20px;cursor:pointer}.archive{max-width:1320px;margin:15px auto 30px;font-size:11px;color:#79765d;padding:0 20px}@media(max-width:650px){.intro{align-items:flex-start;flex-direction:column;padding:17px 12px}body>header b{font-size:21px}.review-report{padding:24px}}</style></head><body>
<header><b>洪武 · 兵起濠州</b><a href="../index.html">返回章节目录 ↗</a></header><section class="intro"><div><h1>阵前试兵</h1><p>在独立试阵里先看清战斗。主线节点已接入同一套棋盘，试阵不会改变章节进度。</p></div><nav><select id="scenario" aria-label="选择试阵战场"><option value="hengjian">横涧 · 城垒</option><option value="ravine">涧侧 · 伏兵</option><option value="caishi">采石 · 渡江</option><option value="watergate">水寨 · 舟战</option><option value="longwan">龙湾 · 合击</option><option value="hongdu" selected>洪都 · 城防待援</option><option value="rescue">鄱阳 · 护援主舟</option><option value="fire">鄱阳 · 火攻水道</option><option value="blockade">湖口 · 封锁</option></select><button id="reset">重新布阵</button><button id="music">军乐：开</button></nav></section><main id="arena"></main><p class="archive">试阵与主线共用战斗计算；六支小队和棋盘格是玩法尺度。当前为可玩初版，兵卒为风格化绘制，主线已包含第五章新原画、逐镜字幕与相应音乐。</p><dialog id="history"><h2>史 · 战场依据</h2><p id="historyText"></p><p>阵位、人数、接战秒数、援军抵达时机与损耗比例为玩法演算；史载进程保留在各章「史」与剧情里。此处不将小队数当成历史总兵力。</p><a href="../chapter4/docs/编年与任将校核.txt">既有编年核对记录 ↗</a><p><button id="return">返回战场</button></p></dialog>
<script src="autochess.js"></script><script src="autochess-ui.js"></script><script src="operations.js"></script><script>
const specs={hongdu:{id:'hongdu',title:'洪都 · 守到援军',battleKind:'defense',reliefAt:240,teams:['邓愈守门队','李继先所部','朱文正应援队'],text:'抚州门缺口与持续守城的指挥窗口。朱文正统守，朱元璋尚未到达；取胜要求撑到接应，不要求歼灭陈军。'},rescue:{id:'poyang-rescue',title:'鄱阳 · 护援主舟',battleKind:'rescue',teams:['常遇春接应队','俞通海舟师','廖永忠舟师'],text:'主舟遇险与诸将接应。棋盘把接应抽为一段，不将史载不同次序的救援强说成同一瞬间。'},fire:{id:'poyang-fire',title:'鄱阳 · 顺风火攻',battleKind:'fire',teams:['俞通海舟师','廖永忠舟师','掩护舟队'],text:'东北风下施放火舟；本版用有限顺风窗口、火路与友军避让表达指挥约束。时间格数为玩法演算。'},blockade:{id:'poyang-blockade',title:'湖口 · 截击与封锁',battleKind:'blockade',teams:['常遇春所部','廖永忠舟师','傅友德所部'],text:'湖口相持与出路截击。陈友谅死于流矢不是玩家点杀首领；张定边与陈理退武昌仍在史实后续。'},hengjian:{id:'hengjian',title:'横涧进营',text:'沿用第二章横涧主线。三处城垒通路用于展示接战、弓手射程与后队接应；地形为战术示意。'},ravine:{id:'ravine',title:'涧侧伏兵',text:'沿用第二章涧侧设伏与城中接应的节点，等待敌军进入后再合击。此处等待秒数与各队站位不是史载数字。'},caishi:{id:'caishi',title:'采石渡江',teams:['常遇春先登队','徐达接应队','汤和后队'],text:'采石渡江保留常遇春先登的史事。后队与军需由舟队自动接运，玩家负责阵势、接应和优先攻击目标。'},watergate:{id:'watergate',title:'水寨突破',text:'沿用第三章水寨突破主线。各舟队自行接近与交锋，玩家可暂停调整目标，具体棋盘不是实测江面。'},longwan:{id:'C4-16',title:'龙湾水陆合击',ambushWindows:2,teams:['常遇春所部','徐达所部','张德胜舟师'],text:'龙湾前情与诸将职守沿用第四章已核对的军议：常遇春石灰山设伏、徐达策应、张德胜舟师。这里截取战术接应窗口，不把全场战事压成精确史图。'}};
const warMusic=new Audio();warMusic.loop=true;warMusic.volume=.20;let musicMuted=false;function music(){const want=spec?.id==='hongdu'?'hongdu':spec?.id?.startsWith('poyang')?'poyang':['caishi','C4-16'].includes(spec?.id)?'caishiji':'advance';if(!warMusic.src.endsWith(want+'.mp3'))warMusic.src='assets/audio/music/'+want+'.mp3';if(!musicMuted&&!document.hidden&&state?.chess?.phase==='running')warMusic.play().catch(()=>{});else warMusic.pause();}document.getElementById('music').onclick=()=>{musicMuted=!musicMuted;document.getElementById('music').textContent='军乐：'+(musicMuted?'关':'开');music();};document.addEventListener('visibilitychange',music);
let spec,state;const pick=document.getElementById('scenario'),arena=document.getElementById('arena');function key(){return 'hongwu-chess-practice-v06-art-'+spec.id;}function save(){localStorage.setItem(key(),JSON.stringify(state));}function enter(reset=false){warMusic.pause();AutoChessUI.stop();spec={mode:'battle',max:12,...specs[pick.value]};let old=null;try{old=JSON.parse(localStorage.getItem(key()));}catch{}state=!reset&&Operations.validate(old,spec)?old:Operations.initial(spec);mount();}function mount(){AutoChessUI.render(arena,state,spec,{update:o=>{const n=Operations.tick(state,o,spec);if(!Operations.validate(n,spec))throw Error('试阵记录校验失败');state=n;save();music();return state;},history:()=>{document.getElementById('historyText').textContent=spec.text;document.getElementById('history').showModal();},retry:()=>enter(true),finish:()=>{const r=state.receipt;arena.innerHTML='<section class="review-report"><small>阵后清点 / 独立试阵</small><h2>军士归队，军械点验。</h2><p>战场耗时 '+Math.floor(state.chess.tick*.35)+' 秒 · 新增待养 '+r.wounded+' · 劳顿 +'+r.fatigue+' · 军械损耗 '+r.wear+'</p><p>这些数值在正式章节中会写入行军账，随后进入该节点的原画 PV。<br>本次试阵不发奖励，也不推进章节。</p><button id="again">调整阵形，再试一次</button></section>';document.getElementById('again').onclick=()=>enter(true);}});arena.querySelector('.chess-finish').textContent='收队 · 查看试阵战报 →';}pick.onchange=()=>enter();document.getElementById('reset').onclick=()=>enter(true);document.getElementById('return').onclick=()=>{document.getElementById('history').close();mount();};document.getElementById('history').addEventListener('cancel',()=>setTimeout(mount));enter();
</script></body></html>
